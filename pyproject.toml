[project]
name = "catqubit"
version = "0.1.0"
description = "Tested building blocks for the Alice & Bob cat-qubit challenge (DuQuantum 2026)"
requires-python = ">=3.11"
dependencies = ["dynamiqs>=0.3", "jax", "numpy"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catqubit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: full two-mode simulations (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
# Notebooks are generated by tools/build_*notebook.py or supplied by the challenge.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long lines there are notebook cell text (LaTeX markdown and cell code), not builder logic.
"tools/build_notebook.py" = ["E501"]
# The claim patterns match printed notebook lines verbatim; wrapping them hurts grep-ability.
"tools/extract_task1_claims.py" = ["E501"]
"tools/task1_deck/*.py" = ["E501"]
"tools/build_track1_page.py" = ["E501"]  # slide text and HTML templates
# Markdown summary tables and plot labels.
"studies/task24d_readout_upgrades.py" = ["E501"]
"studies/task24e_time_domain.py" = ["E501"]
